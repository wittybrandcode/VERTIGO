<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERTIGO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 23 23'%3E%3Crect width='23' height='23' fill='%23111114'/%3E%3Cg fill='none' stroke='%23d4d4e2' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M11.5 3.5 a8 8 0 1 1 -5.7 2.4'/%3E%3Cpath d='M11.5 6.6 a4.9 4.9 0 1 1 -3.5 1.5'/%3E%3Ccircle cx='11.5' cy='11.5' r='1' fill='white' stroke='none'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #111114;
    --panel: #17171d;
    --panel-2: #1e1e27;
    --panel-hi: #2b2b38;
    --border: rgba(255, 255, 255, 0.09);
    --border-hi: rgba(255, 255, 255, 0.20);
    --focus: #5b8def;
    --text: #dcdce8;
    --bright: #e8e8f2;
    --muted: #686878;
    --coke: #d4d4e2;
    --coke-dark: #b8b8c8;
    --danger: #d46a74;
    --radius: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 11px/1.35 system-ui, "Segoe UI", Tahoma, sans-serif;
    width: 100%; min-height: 100%; padding: 0;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 12px;
    border-bottom: 1px solid var(--border);
  }
  header svg { width: 20px; height: 20px; }
  header .name { font-weight: 700; letter-spacing: 2px; font-size: 13px; }
  header .ver { margin-left: auto; color: var(--muted); font-size: 11px; }
  .ibtn {
    min-height: 44px; min-width: 44px; padding: 5px 10px; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font: inherit;
  }
  .ibtn svg { width: 17px; height: 17px; }
  .ibtn .g { font-size: 15px; line-height: 1.1; }
  .ibtn .w { font-size: 9px; letter-spacing: .4px; color: var(--muted); line-height: 1; }
  .ibtn:hover { background: var(--panel-hi); border-color: #4a4a5e; color: var(--bright); }
  .ibtn:hover .w { color: var(--bright); }
  .ibtn:active { transform: scale(0.96); }
  .ibtn.primary { border-color: var(--border-hi); color: var(--bright); }
  .ibtn.primary:hover { background: var(--coke); border-color: var(--coke); color: #161620; }
  .ibtn.primary:hover .w { color: #161620; }
  .ibtn:disabled { opacity: .4; cursor: default; }
  .ibtn:disabled:hover { background: var(--panel-2); border-color: var(--border); }
  .ibtn.primary .w { color: var(--text); }
  .ibtn:focus-visible { outline: 2px solid var(--coke); outline-offset: 1px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  input[type="text"], input[type="number"] {
    height: 34px; padding: 0 8px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    font: inherit; font-weight: 700; text-align: right;
  }
  input[type="text"]:focus, input[type="number"]:focus { border-color: var(--focus); outline: none; }
  input[type="range"] { accent-color: var(--coke); }
  input[type="checkbox"] { accent-color: var(--coke); width: 16px; height: 16px; }
  input:disabled { opacity: .35; }
  /* camera bar + groups */
  #sec-cam, #sec-track { padding: 8px 12px 0; }
  #cam-name, #track-name {
    flex: 1; color: var(--muted); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  details.camgroup {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); margin: 0 12px 8px;
  }
  details.camgroup summary {
    cursor: pointer; padding: 9px 10px; font-weight: 700;
    letter-spacing: 1px; font-size: 11px; list-style-position: inside;
  }
  .camrows { padding: 2px 10px 10px; }
  .row.prow { gap: 8px; }
  .row.prow .w { flex: none; width: 66px; font-size: 10px; color: var(--muted); }
  .row.prow input[type="range"] { flex: 1; min-width: 0; }
  .row.prow input[type="number"] { flex: none; width: 62px; }
  .row.prow .rst { flex: none; min-width: 26px; width: 26px; min-height: 30px; padding: 2px; }
  .row.prow3 > .w { width: 30px; }
  .row.prow3 .axis { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row.prow3 .axis input[type="range"] { width: 100%; height: 14px; }
  .row.prow3 .axrow { display: flex; align-items: center; gap: 3px; }
  .row.prow3 .axrow .ax { font-size: 9px; color: var(--muted); flex: none; width: 10px; }
  .row.prow3 .axrow .xbox { flex: none; width: 30px; height: 24px; font-size: 10px; padding: 0 2px; }
  .row.prow3 .axrow input[type="number"] { flex: 1; min-width: 0; width: auto; height: 24px; font-size: 10px; padding: 0 2px; }
  .row.prow3 .axis .cw { font-size: 9px; color: var(--muted); line-height: 1.2; }
  .row.prow3 .axis > input[type="number"] { width: 100%; height: 24px; font-size: 10px; padding: 0 4px; }
  /* debug drawer */
  #sec-debug { margin: 0 12px 8px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  #sec-debug .row { margin-bottom: 6px; }
  #vrt-log {
    list-style: none; max-height: 120px; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px 8px; font: 10px/1.6 ui-monospace, Consolas, monospace;
  }
  #vrt-log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vrt-log li.lg-call { color: var(--muted); }
  #vrt-log li.lg-ok { color: var(--text); }
  #vrt-log li.lg-err { color: var(--danger); }
  details.camgroup summary {
    cursor: pointer; padding: 8px 10px; font-weight: 700;
    letter-spacing: .6px; font-size: 10px; color: var(--muted);
    text-transform: uppercase; list-style-position: inside;
  }
  .ibtn.grst { float: right; min-width: 24px; width: 24px; min-height: 22px; padding: 1px; transform: translateY(-3px); }
  details.camgroup summary:hover { color: var(--bright); }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b2b38; }
  ::-webkit-scrollbar-thumb:hover { background: var(--coke); }
  footer {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 11px; min-height: 24px;
  }
  #vrt-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text); flex: none; }
  footer[data-kind="working"] #vrt-dot { background: var(--coke); animation: pulse 1s infinite; }
  footer[data-kind="ok"] #vrt-dot { background: var(--text); }
  footer[data-kind="err"] #vrt-dot { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { footer[data-kind="working"] #vrt-dot { animation: none; } }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 23 23" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M11.5 3.5 a8 8 0 1 1 -5.7 2.4"/><path d="M11.5 6.6 a4.9 4.9 0 1 1 -3.5 1.5"/>
      <path d="M11.5 9.4 a2.1 2.1 0 1 1 -1.5 0.6"/><circle cx="11.5" cy="11.5" r="0.9" fill="#FFFFFF" stroke="none"/>
    </svg>
    <span class="name">VERTIGO</span>
    <button class="ibtn" id="btn-debug" title="Debug log" style="margin-left:auto;min-height:30px;flex-direction:row;"><span class="g">&lt;/&gt;</span><span class="w">Log</span></button>
    <span class="ver">v1.0</span>
  </header>

  <section id="sec-cam">
    <div class="row">
      <button class="ibtn primary" id="btn-cam-build" title="Create camera or link existing"><span class="g">＋</span><span class="w">Build</span></button>
      <button class="ibtn" id="btn-cam-link" title="Link selected camera"><span class="g">⇥</span><span class="w">Link</span></button>
      <button class="ibtn" id="btn-cam-refresh" title="Read camera values"><span class="g">⟳</span><span class="w">Read</span></button>
    </div>
    <div class="row"><span id="cam-name" title="Linked camera">—</span></div>
  </section>

  <main>
    <details class="camgroup" open>
      <summary>TRANSFORM<button class="ibtn grst" title="Reset group to snapshot" aria-label="Reset group to snapshot"><span class="g">↺</span></button></summary>
      <div class="camrows">
        <div class="row prow prow3"><span class="w">Pos</span><div class="axis"><input id="pos0r" data-prop="pos" data-i="0" data-dims="3" type="range" min="-4000" max="4000" step="1" value="0" title="Position X"><div class="axrow"><span class="ax">X</span><input id="pos0" data-prop="pos" data-i="0" data-dims="3" type="number" step="1" value="0" title="Position X"></div></div><div class="axis"><input id="pos1r" data-prop="pos" data-i="1" data-dims="3" type="range" min="-4000" max="4000" step="1" value="0" title="Position Y"><div class="axrow"><span class="ax">Y</span><input id="pos1" data-prop="pos" data-i="1" data-dims="3" type="number" step="1" value="0" title="Position Y"></div></div><div class="axis"><input id="pos2r" data-prop="pos" data-i="2" data-dims="3" type="range" min="-4000" max="4000" step="1" value="0" title="Position Z"><div class="axrow"><span class="ax">Z</span><input id="pos2" data-prop="pos" data-i="2" data-dims="3" type="number" step="1" value="0" title="Position Z"></div></div></div>
        <div class="row prow prow3"><span class="w">POI</span><div class="axis"><input id="poi0r" data-prop="poi" data-i="0" data-dims="3" type="range" min="-4000" max="4000" step="1" value="0" title="Point of Interest X"><div class="axrow"><span class="ax">X</span><input id="poi0" data-prop="poi" data-i="0" data-dims="3" type="number" step="1" value="0" title="Point of Interest X"></div></div><div class="axis"><input id="poi1r" data-prop="poi" data-i="1" data-dims="3" type="range" min="-4000" max="4000" step="1" value="0" title="Point of Interest Y"><div class="axrow"><span class="ax">Y</span><input id="poi1" data-prop="poi" data-i="1" data-dims="3" type="number" step="1" value="0" title="Point of Interest Y"></div></div><div class="axis"><input id="poi2r" data-prop="poi" data-i="2" data-dims="3" type="range" min="-4000" max="4000" step="1" value="0" title="Point of Interest Z"><div class="axrow"><span class="ax">Z</span><input id="poi2" data-prop="poi" data-i="2" data-dims="3" type="number" step="1" value="0" title="Point of Interest Z"></div></div></div>
        <div class="row prow prow3"><span class="w">Or</span><div class="axis"><input id="orient0r" data-prop="orient" data-i="0" data-dims="3" type="range" min="-180" max="180" step="0.1" value="0" title="Orientation X"><div class="axrow"><span class="ax">X</span><input id="orient0x" class="xbox" type="number" step="1" value="0" title="Revolutions"><input id="orient0" data-prop="orient" data-i="0" data-dims="3" type="text" step="0.1" value="0" title="Orientation X (e.g. 1x45)"></div></div><div class="axis"><input id="orient1r" data-prop="orient" data-i="1" data-dims="3" type="range" min="-180" max="180" step="0.1" value="0" title="Orientation Y"><div class="axrow"><span class="ax">Y</span><input id="orient1x" class="xbox" type="number" step="1" value="0" title="Revolutions"><input id="orient1" data-prop="orient" data-i="1" data-dims="3" type="text" step="0.1" value="0" title="Orientation Y (e.g. 1x45)"></div></div><div class="axis"><input id="orient2r" data-prop="orient" data-i="2" data-dims="3" type="range" min="-180" max="180" step="0.1" value="0" title="Orientation Z"><div class="axrow"><span class="ax">Z</span><input id="orient2x" class="xbox" type="number" step="1" value="0" title="Revolutions"><input id="orient2" data-prop="orient" data-i="2" data-dims="3" type="text" step="0.1" value="0" title="Orientation Z (e.g. 1x45)"></div></div></div>
        <div class="row prow prow3"><span class="w">Rot</span><div class="axis"><input id="rotx0r" data-prop="rotx" data-i="0" data-dims="1" type="range" min="-180" max="180" step="0.1" value="0" title="X Rotation"><div class="axrow"><span class="ax">X</span><input id="rotx0x" class="xbox" type="number" step="1" value="0" title="Revolutions"><input id="rotx0" data-prop="rotx" data-i="0" data-dims="1" type="text" step="0.1" value="0" title="X Rotation (e.g. 1x45)"></div></div><div class="axis"><input id="roty0r" data-prop="roty" data-i="0" data-dims="1" type="range" min="-180" max="180" step="0.1" value="0" title="Y Rotation"><div class="axrow"><span class="ax">Y</span><input id="roty0x" class="xbox" type="number" step="1" value="0" title="Revolutions"><input id="roty0" data-prop="roty" data-i="0" data-dims="1" type="text" step="0.1" value="0" title="Y Rotation (e.g. 1x45)"></div></div><div class="axis"><input id="rotz0r" data-prop="rotz" data-i="0" data-dims="1" type="range" min="-180" max="180" step="0.1" value="0" title="Z Rotation"><div class="axrow"><span class="ax">Z</span><input id="rotz0x" class="xbox" type="number" step="1" value="0" title="Revolutions"><input id="rotz0" data-prop="rotz" data-i="0" data-dims="1" type="text" step="0.1" value="0" title="Z Rotation (e.g. 1x45)"></div></div></div>
        <div class="row prow"><span class="w">Opacity</span><input id="opacity0r" data-prop="opacity" data-i="0" data-dims="1" type="range" min="0" max="100" step="1" value="100" title="Opacity"><input id="opacity0" data-prop="opacity" data-i="0" data-dims="1" type="number" step="1" value="100" title="Opacity"></div>
      </div>
    </details>

  <section id="sec-track">
    <div class="row">
      <button class="ibtn" id="btn-track-set" title="Track selected layer (look + focus)"><span class="g">◎</span><span class="w">Track</span></button>
      <button class="ibtn" id="btn-track-clear" title="Stop tracking"><span class="g">✕</span><span class="w">Untrack</span></button>
    </div>
    <div class="row"><span id="track-name" title="Tracking target">—</span></div>
  </section>

    <details class="camgroup" open>
      <summary>LENS<button class="ibtn grst" title="Reset group to snapshot" aria-label="Reset group to snapshot"><span class="g">↺</span></button></summary>
      <div class="camrows">
        <div class="row prow prow3"><div class="axis"><span class="cw">Zoom</span><input id="zoom0r" data-prop="zoom" data-i="0" data-dims="1" type="range" min="10" max="5000" step="1" value="1000" title="Zoom"><input id="zoom0" data-prop="zoom" data-i="0" data-dims="1" type="number" step="1" value="1000" title="Zoom"></div><div class="axis"><span class="cw">Focus</span><input id="focus0r" data-prop="focus" data-i="0" data-dims="1" type="range" min="0" max="30000" step="10" value="5000" title="Focus Distance"><input id="focus0" data-prop="focus" data-i="0" data-dims="1" type="number" step="10" value="5000" title="Focus Distance"></div><div class="axis"><span class="cw">Aperture</span><input id="aperture0r" data-prop="aperture" data-i="0" data-dims="1" type="range" min="0.5" max="64" step="0.1" value="8" title="Aperture"><input id="aperture0" data-prop="aperture" data-i="0" data-dims="1" type="number" step="0.1" value="8" title="Aperture"></div></div>
        <div class="row prow"><span class="w">Blur</span><input id="blur0r" data-prop="blur" data-i="0" data-dims="1" type="range" min="0" max="100" step="1" value="0" title="Blur Level"><input id="blur0" data-prop="blur" data-i="0" data-dims="1" type="number" step="1" value="0" title="Blur Level"></div>
        <div class="row prow"><span class="w">DOF</span><input id="dof0" data-prop="dof" data-i="0" data-dims="0" type="checkbox" title="Depth of Field"></div>
      </div>
    </details>

    <details class="camgroup">
      <summary>IRIS &amp; LIGHT<button class="ibtn grst" title="Reset group to snapshot" aria-label="Reset group to snapshot"><span class="g">↺</span></button></summary>
      <div class="camrows">
        <div class="row prow prow3"><div class="axis"><span class="cw">Shape</span><input id="irisShape0r" data-prop="irisShape" data-i="0" data-dims="1" type="range" min="1" max="6" step="1" value="6" title="Iris Shape"><input id="irisShape0" data-prop="irisShape" data-i="0" data-dims="1" type="number" step="1" value="6" title="Iris Shape"></div><div class="axis"><span class="cw">Rot</span><input id="irisRot0r" data-prop="irisRot" data-i="0" data-dims="1" type="range" min="-180" max="180" step="1" value="0" title="Iris Rotation"><input id="irisRot0" data-prop="irisRot" data-i="0" data-dims="1" type="number" step="1" value="0" title="Iris Rotation"></div><div class="axis"><span class="cw">Round</span><input id="irisRound0r" data-prop="irisRound" data-i="0" data-dims="1" type="range" min="0" max="100" step="1" value="0" title="Iris Roundness"><input id="irisRound0" data-prop="irisRound" data-i="0" data-dims="1" type="number" step="1" value="0" title="Iris Roundness"></div></div>
        <div class="row prow prow3"><div class="axis"><span class="cw">Aspect</span><input id="irisAspect0r" data-prop="irisAspect" data-i="0" data-dims="1" type="range" min="10" max="200" step="1" value="100" title="Iris Aspect Ratio"><input id="irisAspect0" data-prop="irisAspect" data-i="0" data-dims="1" type="number" step="1" value="100" title="Iris Aspect Ratio"></div><div class="axis"><span class="cw">Gain</span><input id="hiGain0r" data-prop="hiGain" data-i="0" data-dims="1" type="range" min="0" max="200" step="1" value="0" title="Highlight Gain"><input id="hiGain0" data-prop="hiGain" data-i="0" data-dims="1" type="number" step="1" value="0" title="Highlight Gain"></div><div class="axis"><span class="cw">Thresh</span><input id="hiThresh0r" data-prop="hiThresh" data-i="0" data-dims="1" type="range" min="0" max="255" step="1" value="128" title="Highlight Threshold"><input id="hiThresh0" data-prop="hiThresh" data-i="0" data-dims="1" type="number" step="1" value="128" title="Highlight Threshold"></div></div>
        <div class="row prow"><span class="w">HiSat</span><input id="hiSat0r" data-prop="hiSat" data-i="0" data-dims="1" type="range" min="0" max="100" step="1" value="0" title="Highlight Saturation"><input id="hiSat0" data-prop="hiSat" data-i="0" data-dims="1" type="number" step="1" value="0" title="Highlight Saturation"></div>
      </div>
    </details>

    <details class="camgroup" open>
      <summary>RAIL<button class="ibtn grst" title="Reset group to snapshot" aria-label="Reset group to snapshot"><span class="g">↺</span></button></summary>
      <div class="camrows">
        <div class="row prow prow3"><div class="axis"><span class="cw">Width</span><input id="rail-widthr" type="range" min="100" max="8000" step="10" value="2500" title="Rail diameter"><input id="rail-width" type="number" step="10" value="2500" title="Rail diameter"></div><div class="axis"><span class="cw">Prog</span><input id="rail-progr" type="range" min="0" max="100" step="0.5" value="0" title="Orbit progress %"><input id="rail-prog" type="number" step="0.5" value="0" title="Orbit progress %"></div><div class="axis"><span class="cw">Height</span><input id="rail-heightr" type="range" min="-2000" max="2000" step="10" value="0" title="Height above rail"><input id="rail-height" type="number" step="10" value="0" title="Height above rail"></div></div>
        <div class="row prow prow3"><span class="w">Tilt</span><div class="axis"><input id="rail-tiltxr" type="range" min="-180" max="180" step="1" value="0" title="Rail tilt X"><div class="axrow"><span class="ax">X</span><input id="rail-tiltx" type="number" step="1" value="0" title="Rail tilt X"></div></div><div class="axis"><input id="rail-tiltzr" type="range" min="-180" max="180" step="1" value="0" title="Rail tilt Z"><div class="axrow"><span class="ax">Z</span><input id="rail-tiltz" type="number" step="1" value="0" title="Rail tilt Z"></div></div></div>
        <div class="row" role="group" aria-label="Rail plane">
          <button class="ibtn" id="btn-plane-floor" title="Flat orbit floor"><span class="g">▬</span><span class="w">Floor</span></button>
          <button class="ibtn" id="btn-plane-wall" title="Vertical front wall"><span class="g">▯</span><span class="w">Wall</span></button>
          <button class="ibtn" id="btn-plane-side" title="Vertical side wall"><span class="g">◫</span><span class="w">Side</span></button>
        </div>
        <div class="row prow prow3"><span class="w">Rail</span><div class="axis"><input id="rail-xr" type="range" min="-4000" max="4000" step="10" value="960" title="Rail position X"><div class="axrow"><span class="ax">X</span><input id="rail-x" type="number" step="10" value="960" title="Rail position X"></div></div><div class="axis"><input id="rail-yr" type="range" min="-4000" max="4000" step="10" value="540" title="Rail position Y"><div class="axrow"><span class="ax">Y</span><input id="rail-y" type="number" step="10" value="540" title="Rail position Y"></div></div><div class="axis"><input id="rail-zr" type="range" min="-4000" max="4000" step="10" value="0" title="Rail position Z"><div class="axrow"><span class="ax">Z</span><input id="rail-z" type="number" step="10" value="0" title="Rail position Z"></div></div></div>
        <div class="row">
          <button class="ibtn primary" id="btn-rail-build" title="Build circle rail"><span class="g">○</span><span class="w">Rail</span></button>
          <button class="ibtn" id="btn-rail-clear" title="Remove rail expression"><span class="g">✕</span><span class="w">Clear</span></button>
          <button class="ibtn" id="btn-rail-look" title="Follow rail center on/off"><span class="g">◉</span><span class="w">Look</span></button>
          <button class="ibtn" id="btn-rail-focus" title="Toggle focus on rail center"><span class="g">◎</span><span class="w">Focus</span></button>
        </div>
      </div>
    </details>
  </main>

  <section id="sec-debug" hidden aria-label="Debug log">
    <div class="row">
      <button class="ibtn" id="btn-log-clear" title="Clear log"><span class="g">✕</span><span class="w">Clear</span></button>
      <button class="ibtn" id="btn-log-copy" title="Copy full log to clipboard"><span class="g">⧉</span><span class="w">Copy</span></button>
    </div>
    <ol id="vrt-log"></ol>
  </section>

  <footer data-kind="ready"><span id="vrt-dot"></span><span id="vrt-status">ready</span></footer>

  <script src="./js/CSInterface.js"></script>
  <script src="./js/main.js"></script>
  <script>
    if (typeof window.vrtBridgeInit === 'function') { window.vrtBridgeInit(function (id) { return document.getElementById(id); }); }
  </script>
</body>
</html>
